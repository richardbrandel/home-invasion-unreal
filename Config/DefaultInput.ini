; Axis and action mappings instead of Enhanced Input, and this is a DELIBERATE tradeoff
; worth stating rather than burying. Enhanced Input is Unreal's current stack and this
; project defaults to it, but its actions and mapping contexts are .uasset files -- and
; this project has no editor-authored content, because everything so far has been written
; as text and built headlessly. Legacy mappings live in this file, so they can be written,
; diffed, reviewed and built without opening the editor.
;
; What is given up: Enhanced Input's modifiers, triggers and per-player contexts. What is
; not: the bindings themselves, which are the same six keys either way. Migrating means
; authoring IA_/IMC_ assets in the editor and swapping the two class lines back.
+AxisMappings=(AxisName="MoveForward",Scale=1.000000,Key=W)
+AxisMappings=(AxisName="MoveForward",Scale=-1.000000,Key=S)
+AxisMappings=(AxisName="MoveRight",Scale=1.000000,Key=D)
+AxisMappings=(AxisName="MoveRight",Scale=-1.000000,Key=A)
+AxisMappings=(AxisName="Turn",Scale=1.000000,Key=MouseX)
+AxisMappings=(AxisName="LookUp",Scale=-1.000000,Key=MouseY)
+ActionMappings=(ActionName="Fire",Key=LeftMouseButton)
+ActionMappings=(ActionName="Shove",Key=F)
+ActionMappings=(ActionName="Crouch",Key=C)
+ActionMappings=(ActionName="Crouch",Key=LeftControl)
+ActionMappings=(ActionName="Sprint",Key=LeftShift)
+ActionMappings=(ActionName="Reload",Key=R)
; Weapon select and restart. Bound here as well as read as raw keys, because a key that is
; not in the input stack is a key WasInputKeyJustPressed cannot see -- and the failure mode
; is a control that silently does nothing, which is indistinguishable from a sim bug. Each
; weapon keeps its OWN magazine, so switching is a choice about ammunition rather than the
; free reload it was in the Godot original before that was fixed there.
+ActionMappings=(ActionName="SwitchPistol",Key=One)
+ActionMappings=(ActionName="SwitchShotgun",Key=Two)
+ActionMappings=(ActionName="Restart",Key=Enter)
DefaultTouchInterface=/Engine/MobileResources/HUD/DefaultVirtualJoysticks.DefaultVirtualJoysticks
