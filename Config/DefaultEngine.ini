[/Script/EngineSettings.GameMapsSettings]
; The game mode is C++, so it is named by class path rather than by a Blueprint asset.
GlobalDefaultGameMode=/Script/HIUnreal.HIGameMode
GlobalDefaultServerGameMode=/Script/HIUnreal.HIGameMode

; `/Engine/Maps/Entry` is the engine's own EMPTY map, and it is chosen for what it does NOT
; contain. The earlier choice was `/Engine/Maps/Templates/Template_Default`, which ships a
; floor, a sky and its own lights -- and every one of those would have been a second opinion
; against AHIGameMode::SetupLighting and AHIHouse::Build. The house is generated from the
; sim's rectangle list, so a level that ALSO contains geometry is exactly the drift between
; what the player walks into and what the AI reasons about that this port exists to avoid.
; A .umap is a binary asset and cannot be authored from text, so the empty one is the only
; honest choice: the level is a container, and everything in it is code.
GameDefaultMap=/Engine/Maps/Entry
EditorStartupMap=/Engine/Maps/Entry
ServerDefaultMap=/Engine/Maps/Entry

[/Script/Engine.RendererSettings]
; ---- fix-list item 21, "Reflections / GI: flat ambient only."
;
; LUMEN IS OFF, and it is a CRASH that turned it off rather than a change of mind about how
; the game should look. The first two sessions a person played both ended in a SIGSEGV with
; no frame from this project in the stack:
;
;   FSceneExtensionsUpdaters::End()            [Renderer/Private/SceneExtensions.cpp:108]
;   UE::Tasks::Wait<TStaticArray<FTaskHandle, 7>>
;   SIGSEGV at 0x0 in FTaskBase::FSubsequents::PushIfNotClosed
;
; It killed the game at almost exactly 60 seconds, every time, which looked at first like a
; garbage-collection problem in this port's audio code -- and that hunt did find two real
; bugs (see HIAudio.cpp), which is why the crash line kept moving. What it turned out to be
; is the render graph tearing down scene extensions: `FSceneExtensionsUpdaters` is what
; Lumen and the other scene extensions register with.
;
; MEASURED, not guessed: the same session that died at 60 s survived **240 s** with these
; three cvars off, on the same build, same box, same driver. So this is a trade of item 21
; for a game that can be played, and it is worth reversing if a later driver or engine
; version fixes it -- set them back and run for four minutes to check.
;
;   0 = none          (what this uses for both)
;   1 = Lumen         (the UE5 default, and what this used to be)
;   2 = screen space  (for reflections)
;
; Not narrowed further: whether it is Lumen's GI, its reflections, or the pair. One
; four-minute run each would say, and it is the obvious next experiment if the look matters
; more than the certainty.
r.DynamicGlobalIlluminationMethod=0
r.ReflectionMethod=0
; ---- anti-aliasing and shadows, and these two are BUILD-BOX decisions rather than art ones.
;
; Measured 2026-10-09 on the 4-core Linux box: the very first run of this game blocked in
; global shader compilation for over 25 minutes without ever reaching a frame, and every
; line in that time was a Temporal Super Resolution permutation -- 130+ of them, 30-70
; seconds each, on three worker processes. TSR is UE5's default and it is by far the largest
; shader cost in a first run. This project exists for its headless iteration loop, so a
; 30-minute wall in front of every fresh environment is the wrong trade.
;
;   2 = TAA  (what this uses)
;   4 = TSR  (the UE5 default; set r.AntiAliasingMethod=4 to restore it)
;
; Nothing else depends on the choice. The same argument, one notch smaller, for virtual
; shadow maps: for one directional light and five point lights over static geometry, classic
; shadow maps look equivalent and cost far fewer shader permutations.
r.AntiAliasingMethod=2
r.Shadow.Virtual.Enable=0
; Lumen's indirect lighting needs distance fields for the meshes it lights. Lumen is off now,
; so this is no longer load-bearing -- left on because it costs little and would be needed
; again the moment Lumen comes back.
r.GenerateMeshDistanceFields=True

; ---- exposure, and this setting is why the first renders were washed out.
;
; The first capture attempt pinned exposure (`r.DefaultFeature.AutoExposure=False`) to make
; one frame comparable with the next. That was measured and then REVERSED, because the
; arithmetic does not work: a sunlit lawn is on the order of 100,000 lux and a 2000-lumen
; lamp two metres away is on the order of 20. There is no single exposure that shows both --
; pinning it made the interior blow to pure white with the exterior a flat mid-green, and
; the frame through the open front door was a solid white rectangle with no detail in it.
; Auto-exposure exists for exactly this range, so it stays on (the UE5 default) and the
; determinism argument moves to the two settings that actually cost nothing to fix: motion
; blur and lens flare.
r.DefaultFeature.AutoExposure=True
; The same argument for the other temporal effects: a frame captured mid-blur is not a
; measurement of anything.
r.DefaultFeature.MotionBlur=False
r.DefaultFeature.LensFlare=False
; Bloom and ambient occlusion stay. They are what stops a flat-shaded box world reading as
; unlit plastic, and neither drifts between frames of a still scene.
r.DefaultFeature.Bloom=True
r.DefaultFeature.AmbientOcclusion=True
r.DefaultFeature.AmbientOcclusionStaticFraction=False

; ---- no baked lighting at all, stated rather than assumed.
; There is no editor session in this project's build loop, so nothing can ever build lighting.
; Leaving static lighting enabled makes every light report "Lighting needs to be rebuilt" and
; render unpredictably, which is a far more confusing failure than not offering the option.
; Every light AHIGameMode spawns is Movable.
r.AllowStaticLighting=False
