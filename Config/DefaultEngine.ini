; A BOOTSTRAP map, borrowed from the engine. A .umap is a binary asset that cannot be
; authored from text, and this project has no editor-authored content -- so rather than
; leave the project un-runnable, it points at an engine template and the game mode spawns
; its own bodies into it. Replace this with a project map once one exists; nothing depends
; on which map it is beyond being empty.
