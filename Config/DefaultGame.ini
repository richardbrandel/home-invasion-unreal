[/Script/UnrealEd.ProjectPackagingSettings]
; This project has no .umap of its own: the house, the intruders and the furniture are
; built in C++ at runtime, and every asset is loaded by path (LoadObject) rather than
; referenced from a map. A default cook therefore sees no references to anything under
; /Game and ships a package containing only engine content.
;
; That is exactly what the first packaged Windows build did: the log said
;   Failed to find object 'SkeletalMesh /Game/HIImported/characters_louise/idle.idle'
;   Failed to find object 'StaticMesh /Game/Weapons/Pistol/Meshes/SM_Pistol.SM_Pistol'
;   Failed to find object 'StaticMesh /Game/HIImported/models/Sofa_01/...'
; and the game showed invisible people, no pistol, no refrigerator and cube furniture.
;
; Cook everything under /Game. The set is small enough that precision is not worth the
; risk of missing a directory that only the code knows about.
bCookAll=True
