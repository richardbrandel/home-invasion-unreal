[/Script/UnrealEd.ProjectPackagingSettings]
; This project has no .umap of its own: the house, the intruders and the furniture are
; built in C++ at runtime, and every asset is loaded by path (LoadObject) rather than
; referenced from a map. A default cook therefore sees no references to anything under
; /Game and ships a package containing only engine content.
;
; That is exactly what the first packaged Windows build did: the log said
;   Failed to find object 'SkeletalMesh /Game/HIImported/characters_louise/idle.idle'
;   Failed to find object 'StaticMesh /Game/Weapons/Pistol/Meshes/SM_Pistol.SM_Pistol'
;   Failed to find object 'StaticMesh /Game/HIImported/models/Sofa_01/...'
; and the game showed invisible people, no pistol, no refrigerator and cube furniture.
;
; Cook everything under /Game. The set is small enough that precision is not worth the
; risk of missing a directory that only the code knows about.
bCookAll=True

; Zen and IoStore: Unreal's cook writes through a local Zen server and connects to it
; at the hardcoded IPv6 loopback [::1]:8558. This build host has no IPv6 loopback at
; all (`ip -6 addr show lo` is empty), so the cook died with
;   Fatal error: ZenStoreWriter.cpp:497 Failed to delete oplog on the ZenServer
;   AutomationTool exiting with ExitCode=25 (Error_UnknownCookFailure)
; bUseZenStore only chooses the transport -- the cooked output is the same IoStore data
; either way -- so turning it off makes the cook independent of the host's IPv6.
bUseZenStore=False

; ENGINE CONTENT REFERENCED ONLY FROM CODE IS NOT COOKED BY bCookAll, which covers /Game. And
; cook only sees a reference if it is in an ASSET: a string in C++ is invisible to it.
;
; HIAudio.cpp routes every cue through `/Engine/EngineSounds/SFX.SFX` so that a master/SFX
; balance is possible, and the package did not contain it -- found 2026-11-08 by running the
; dart soak against the PACKAGED binary, where it logged once per run:
;   Warning: Failed to find object 'SoundClass /Engine/EngineSounds/SFX.SFX'
; The editor has engine content on disk, so a test that asserts the class loads passes there and
; cannot catch this. In a package every cue fell back to Master and the routing was silently gone.
;
; The DIRECTORY form is what works. `DirectoriesToAlwaysCook=(Path="/Engine/EngineSounds/SFX")`,
; naming the asset, does NOT cook it -- tried, recooked, asset still absent. Name the folder.
+DirectoriesToAlwaysCook=(Path="/Engine/EngineSounds")
